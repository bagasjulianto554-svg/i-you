
<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8dce5">
  <title>i & you — Kotak Surat Kita</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo">♡</div>
      <p class="eyebrow">A LITTLE PLACE FOR US</p>
      <h1>i <span>&</span> you</h1>
      <p>Surat kecil, rasa yang besar.</p>
    </header>

    <section id="setup" class="card">
      <h2>💌 Kotak surat kita</h2>
      <p>Masukkan nama dan kode pasangan yang sama di kedua HP.</p>
      <form id="setupForm">
        <label for="username">Nama panggilan kamu</label>
        <input id="username" maxlength="30" placeholder="Contoh: You" required>
        <label for="pairCode">Kode pasangan</label>
        <input id="pairCode" minlength="8" maxlength="80"
          placeholder="Kode rahasia minimal 8 karakter" required>
        <button type="submit">Buka kotak surat ♡</button>
      </form>
      <p id="setupMessage" class="message"></p>
    </section>

    <section id="app" hidden>
      <div class="welcome">
        <div>
          <p class="eyebrow">KOTAK SURAT KITA</p>
          <h2>Hai, <span id="welcomeName"></span> ♡</h2>
        </div>
        <button id="changeProfile" class="light-button">Ganti nama</button>
      </div>

      <div class="envelope-area">
        <div class="envelope"><span>♡</span></div>
        <p>Selalu ada cerita untuk disampaikan.</p>
      </div>

      <nav class="tabs">
        <button type="button" data-tab="inbox">Kotak masuk</button>
        <button type="button" data-tab="write">Tulis surat</button>
      </nav>

      <section id="inbox" class="card">
        <h2>♡ Surat untuk kita</h2>
        <div id="lettersList"></div>
        <p id="inboxMessage" class="message"></p>
        <button id="refreshButton" class="light-button">Muat ulang surat</button>
      </section>

      <section id="write" class="card" hidden>
        <h2>✎ Tulis surat baru</h2>
        <form id="letterForm">
          <label for="letterTitle">Judul surat</label>
          <input id="letterTitle" maxlength="100"
            placeholder="Untuk hari ini..." required>
          <label for="letterBody">Isi surat</label>
          <textarea id="letterBody" rows="7" maxlength="10000"
            placeholder="Hai kamu..." required></textarea>
          <button type="submit">Kirim surat ♡</button>
        </form>
        <p id="writeMessage" class="message"></p>
      </section>

      <footer class="footer">dibuat dengan hati ♡</footer>
    </section>
  </main>

  <dialog id="letterDialog" class="dialog">
    <button id="closeDialog" class="light-button close">Tutup ×</button>
    <p id="dialogSender" class="eyebrow"></p>
    <h2 id="dialogTitle"></h2>
    <p id="dialogDate" class="muted"></p>
    <div id="dialogBody" class="letter-body"></div>
    <hr>
    <h3>Balasan ♡</h3>
    <div id="repliesList"></div>
    <form id="replyForm">
      <label for="replyBody">Tulis balasan</label>
      <textarea id="replyBody" rows="4" maxlength="5000"
        placeholder="Aku ingin bilang..." required></textarea>
      <button type="submit">Kirim balasan ♡</button>
    </form>
    <p id="replyMessage" class="message"></p>
  </dialog>
</body>
  </html>
